    <h1 id="id1">PROJECTS</h1>
        <div id="sketch-container"></div>
    <script>
    let sketches = ["fireworks.js", "hearts.js", "beating.js", "swirl.js"];
let currentIndex = 0;
let currentSketch = null;

function loadSketch(scriptName) {

    let oldScript = document.getElementById("dynamicSketch");
    if (oldScript) {
        oldScript.remove();
    }

   
    if (window.currentSketch) {
        window.currentSketch.remove(); 
        window.currentSketch = null; 
    }

 
    let script = document.createElement("script");
    script.id = "dynamicSketch";
    script.src = scriptName;
    script.onload = () => {
        console.log(scriptName + " loaded successfully!");
        window.currentSketch = new p5(); 
    };
    script.onerror = () => console.error("Error loading " + scriptName);
    document.body.appendChild(script);
}


loadSketch(sketches[currentIndex]);


document.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight") {
        currentIndex = (currentIndex + 1) % sketches.length; 
        loadSketch(sketches[currentIndex]);
    }
});


    </script>
